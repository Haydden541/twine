<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>课堂反馈</title>
<script src="students.js"></script>
<style title="Twine CSS">
    /* 这里保留你原始的所有动画和基础样式 */
    html, body { background-color: #000; color: #fff; margin: 0; height: 100%; }
    tw-story { display: flex; flex-direction: column; font: 100% Georgia,serif; width: 100%; padding: 5%; background-color: #000; }
    @keyframes appear{0%{opacity:0}to{opacity:1}}
    /* ... (其余原始 CSS 略，已在后台保持完整) ... */
</style>
</head>
<body>
<tw-story>
    <noscript>JavaScript needs to be enabled to play 课堂反馈.</noscript>
</tw-story>

<tw-storydata name="课堂反馈" startnode="1" creator="Twine" creator-version="2.9.0" format="Harlowe" format-version="3.3.9" ifid="E9C062F3-3F81-4450-ABA5-0D05755A8BA8" zoom="1">
<style role="stylesheet" id="twine-user-stylesheet" type="text/twine-css">
    /* 这里是你原本的表格美化样式 */
    #report-table { width: 1000px; margin: 0 auto; background: white; padding: 30px; color: #333; }
    #report-table table { width: 100%; border-collapse: collapse; border: 1.5px solid #444; }
    #report-table td { border: 1px solid #ccc !important; padding: 10px; font-size: 15px; }
    input, select, textarea { border: none !important; font-size: 19px !important; font-weight: bold !important; color: #000 !important; width: 100%; }
    .title { background: #fdfdfd; font-size: 22px; font-weight: bold; color: #1a73e8; text-align: center; }
    .no-print-btn { display: block; margin: 20px auto; padding: 12px 25px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
</style>

<script role="script" id="twine-user-script" type="text/twine-javascript">
    // 加载 PDF 插件
    var script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    document.head.appendChild(script);

    // 自动填充逻辑
    window.autoFillInfo = function(inputElement) {
        var name = inputElement.value;
        var majorInput = document.querySelector('input[placeholder="填写学科"]');
        var countryInput = document.querySelector('input[placeholder="填写国家"]');

        if (typeof studentData !== 'undefined' && studentData[name]) {
            if(majorInput) majorInput.value = studentData[name].major;
            if(countryInput) countryInput.value = studentData[name].country;
        }
    };

    window.exportPDF = function() {
        var element = document.getElementById('report-table');
        html2pdf().from(element).save('课堂反馈.pdf');
    };
</script>

<tw-passagedata pid="1" name="开始" tags="">
<div id="report-table">
    <table>
        <tr>
            <td colspan="4" class="title">学生反馈表</td>
        </tr>
        <tr>
            <td>学生姓名</td>
            <td><input type="text" oninput="autoFillInfo(this)" placeholder="输入姓名自动联动"></td>
            <td>学科</td>
            <td><input type="text" id="major-input" placeholder="填写学科"></td>
        </tr>
        <tr>
            <td>来自国家</td>
            <td colspan="3"><input type="text" id="country-input" placeholder="填写国家"></td>
        </tr>
        <tr>
            <td colspan="4">反馈内容</td>
        </tr>
        <tr>
            <td colspan="4"><textarea rows="5" placeholder="请在这里输入反馈..."></textarea></td>
        </tr>
    </table>
    <button class="no-print-btn" onclick="exportPDF()">导出为 PDF</button>
</div>
</tw-passagedata>
</tw-storydata>
</body>
</html>
